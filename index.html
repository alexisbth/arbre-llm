<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self' https://api.anthropic.com https://generativelanguage.googleapis.com https://api.groq.com https://openrouter.ai https://api.openai.com; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Ramifai</title>
<meta name="theme-color" content="#101418">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header id="topbar">
  <h1>Ramifai <small id="subtitle"></small></h1>
  <button id="btn-select" class="outside-select" type="button" data-i18n="select">Select</button>
  <button id="btn-fit" class="outside-select" type="button" data-i18n="fit">Fit</button>
  <button id="btn-menu" class="outside-select" type="button" data-i18n-aria="moreActions" aria-label="More actions" aria-haspopup="true" aria-expanded="false">⋯</button>
  <button id="btn-merge" class="in-select" type="button">Merge</button>
  <button id="btn-cancel" class="in-select" type="button" data-i18n="cancel">Cancel</button>
  <div id="menu" hidden>
    <button id="btn-settings" type="button" data-i18n="settingsMenu">Settings</button>
    <button id="btn-synthesis" type="button" data-i18n="synthesis">Synthesis</button>
    <button id="btn-export" type="button" data-i18n="exportMenu">Export</button>
    <button id="btn-reset" type="button" data-i18n="reset">Reset</button>
  </div>
</header>

<svg id="map" role="img" data-i18n-aria="mapLabel" aria-label="Conversation map">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="13" markerHeight="13" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowhead" d="M0,0 L10,5 L0,10 z"/>
    </marker>
    <marker id="arrow-active" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="15" markerHeight="15" markerUnits="userSpaceOnUse" orient="auto">
      <path class="arrowhead-active" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <g id="layer"></g>
</svg>

<section id="panel" class="collapsed">
  <div id="corner">
    <button id="btn-restart" type="button" hidden data-i18n="synthesis">Synthesis</button>
    <button id="gauges" type="button" data-i18n-aria="gaugesLabel" aria-label="Tokens used. Tap to change the model's context size.">
      <span class="gauge" id="gauge-path"><span data-i18n="gaugePath">Path</span><span class="bar"><i></i></span><span class="value"></span></span>
      <span class="gauge" id="gauge-tree"><span data-i18n="gaugeTree">Tree</span><span class="bar"><i></i></span><span class="value"></span></span>
    </button>
  </div>
  <button id="handle" type="button" aria-expanded="false" aria-controls="panel-body">
    <span id="panel-title"></span>
    <span id="panel-summary"></span>
  </button>
  <div id="panel-body">
    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="thread" aria-selected="true" data-i18n="tabThread">Thread</button>
      <button type="button" role="tab" data-tab="context" aria-selected="false" data-i18n="tabContext">LLM context</button>
    </div>
    <div id="thread" role="tabpanel"></div>
    <div id="context" role="tabpanel" hidden></div>
  </div>
  <button id="where" type="button"></button>
  <form id="ask-form">
    <textarea id="question" rows="1" dir="auto" data-i18n-aria="questionLabel" aria-label="New question"></textarea>
    <button type="submit" data-i18n="send">Send</button>
  </form>
</section>

<dialog id="settings" aria-labelledby="settings-title">
  <form id="settings-form">
    <h2 id="settings-title" data-i18n="settingsTitle">LLM settings</h2>
    <p class="note" data-i18n="settingsDemoNote">Without a key, the app stays in demo mode (simulated answers).</p>
    <label><span data-i18n="provider">AI provider</span>
      <select id="set-provider"></select>
    </label>
    <p class="note" id="provider-note"></p>
    <label><span data-i18n="apiKey">API key</span>
      <input id="set-key" type="password" autocomplete="off" spellcheck="false">
    </label>
    <label><span data-i18n="model">Model</span>
      <input id="set-model" type="text" list="model-list" autocomplete="off" spellcheck="false">
    </label>
    <datalist id="model-list"></datalist>
    <label id="workspace-field"><span data-i18n="workspace">Workspace ID (only if the API asks for it)</span>
      <input id="set-workspace" type="text" autocomplete="off" spellcheck="false">
    </label>
    <label class="check"><input id="set-keep" type="checkbox"> <span data-i18n="keepKey">Keep the key on this device</span></label>
    <p class="note" id="key-note"></p>
    <label><span data-i18n="placement">New questions</span>
      <select id="set-placement"></select>
    </label>
    <p class="note" data-i18n="placementNote"></p>
    <label><span data-i18n="language">Interface language</span>
      <input id="set-language" type="text" list="languages" autocomplete="off" spellcheck="false" placeholder="English">
    </label>
    <datalist id="languages">
      <option value="English"><option value="Français"><option value="Español"><option value="Deutsch">
      <option value="Italiano"><option value="Português"><option value="Nederlands"><option value="Русский">
      <option value="العربية"><option value="עברית"><option value="हिन्दी"><option value="中文">
      <option value="日本語"><option value="한국어"><option value="Türkçe"><option value="Polski">
    </datalist>
    <p class="note" data-i18n="languageNote">Translated by the AI the first time (an API key is needed), then kept on this device.</p>
    <div class="actions">
      <button id="btn-retranslate" type="button" data-i18n="retranslate">Retranslate</button>
      <button id="btn-clear-key" type="button" data-i18n="clearKey">Clear key</button>
      <button id="btn-close" type="button" data-i18n="close">Close</button>
      <button class="primary" type="submit" data-i18n="save">Save</button>
    </div>
  </form>
</dialog>

<dialog id="sheet" aria-labelledby="sheet-title">
  <h2 id="sheet-title"></h2>
  <p id="sheet-text" class="note"></p>
  <pre id="sheet-body" hidden></pre>
  <div id="sheet-actions" class="actions"></div>
</dialog>

<div id="toast" role="status" aria-live="polite"></div>
<div id="snack" role="status" aria-live="polite"><span></span><button type="button"></button></div>
<div id="print-view"></div>

<script src="app.js"></script>
</body>
</html>
